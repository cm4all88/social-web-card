# Deploys the Yooits preview (never production) whenever preview/yooits is pushed.
# Does nothing until the repository variable PREVIEW_DEPLOY is set to "on".
# Setup: preview/README.md
name: Yooits preview
on:
  push:
    branches: [preview/yooits]
concurrency:
  group: yooits-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.PREVIEW_DEPLOY == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Tests
        run: npx vitest run
      - name: Deploy preview
        run: bash preview/deploy.sh
        env:
          PREVIEW_SUPABASE_URL: ${{ secrets.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
          PREVIEW_SUPABASE_SECRET_KEY: ${{ secrets.PREVIEW_SUPABASE_SECRET_KEY }}
          PREVIEW_SUPABASE_DB_URL: ${{ secrets.PREVIEW_SUPABASE_DB_URL }}
          PREVIEW_STRIPE_SECRET_KEY: ${{ secrets.PREVIEW_STRIPE_SECRET_KEY }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
