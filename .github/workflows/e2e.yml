# Tests the Yooits preview after each push to preview/yooits, once Vercel has
# finished deploying that commit:
# the password gate, public pages, sign-up, the creator dashboard and the owner
# console with its account controls (e2e/preview.e2e.mjs). Read-only apart from
# the test accounts' own data, which the tests put back.
# Needs the repository secret SITE_PASSWORD (the preview password). The address
# is https://yooits-preview.vercel.app unless the repository variable
# PREVIEW_URL says otherwise.
name: Test Yooits preview
on:
  push:
    branches: [preview/yooits]
  workflow_dispatch:
concurrency:
  group: e2e-preview
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Check the password is in place
        id: ready
        env:
          HAVE: ${{ secrets.SITE_PASSWORD != '' }}
        run: |
          if [ "$HAVE" = true ]; then echo "go=yes" >> "$GITHUB_OUTPUT"
          else echo "Skipped: add the repository secret SITE_PASSWORD (deploy/README.md)." | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'yes'
      # Vercel reports each deploy as a "Vercel" status on the commit.
      - name: Wait for Vercel to finish deploying this commit
        if: steps.ready.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/statuses" \
              --jq '[.[] | select(.context == "Vercel")][0].state // "none"')
            case "$state" in
              success) echo "Vercel deployed ${{ github.sha }}"; exit 0 ;;
              failure|error) echo "Vercel's deploy of this commit failed; see the Vercel status on the commit." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Vercel didn't finish deploying within 15 minutes." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'yes'
        with:
          node-version: 22
      - name: Install
        if: steps.ready.outputs.go == 'yes'
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @playwright/test@1.56.1 @supabase/supabase-js
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        if: steps.ready.outputs.go == 'yes'
        run: npx playwright test --config e2e/playwright.config.mjs
        env:
          SITE_URL: ${{ vars.PREVIEW_URL || 'https://yooits-preview.vercel.app' }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TIPPING: ${{ vars.PREVIEW_TIPPING == 'on' }}
      - name: Keep failure screenshots
        if: ${{ always() && hashFiles('e2e/report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: e2e/report/**/*.png
          retention-days: 14
